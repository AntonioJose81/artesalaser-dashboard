<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARTESALASER · Panel Financiero</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #0f0f1a;
    --card: #1a1a2e;
    --card2: #252540;
    --gold: #c9a96e;
    --green: #2ecc71;
    --red: #e74c3c;
    --blue: #3498db;
    --text: #e8e0d5;
    --muted: #8b8b9e;
    --teal: #2a9d8f;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { 
    background: var(--bg); color: var(--text); 
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    padding: 16px; min-height: 100vh;
  }
  .container { max-width: 600px; margin: 0 auto; }
  h1 { font-family: Georgia, serif; font-size: 1.5rem; color: var(--gold); margin-bottom: 4px; }
  .subtitle { font-size: 0.8rem; color: var(--muted); margin-bottom: 20px; }
  
  /* KPI Cards */
  .kpi-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
  .kpi { 
    background: var(--card); border-radius: 12px; padding: 14px 16px;
    border-top: 3px solid var(--gold); position: relative; overflow: hidden;
  }
  .kpi.green { border-top-color: var(--green); }
  .kpi.red { border-top-color: var(--red); }
  .kpi.blue { border-top-color: var(--blue); }
  .kpi-label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.5px; color: var(--muted); margin-bottom: 4px; }
  .kpi-value { font-size: 1.6rem; font-weight: 700; }
  .kpi-value.green { color: var(--green); }
  .kpi-value.gold { color: var(--gold); }
  .kpi-value.red { color: var(--red); }
  .kpi-value.blue { color: var(--blue); }

  /* Charts */
  .chart-card { 
    background: var(--card); border-radius: 12px; padding: 16px; margin-bottom: 12px;
  }
  .chart-card h3 { font-size: 0.85rem; color: var(--muted); margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.5px; }
  .chart-wrap { position: relative; height: 200px; }
  canvas { width: 100% !important; }

  /* Transactions */
  .tx-card { background: var(--card); border-radius: 12px; padding: 16px; margin-bottom: 12px; }
  .tx-row { 
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.05);
  }
  .tx-row:last-child { border-bottom: none; }
  .tx-left { flex: 1; }
  .tx-name { font-size: 0.85rem; font-weight: 600; }
  .tx-detail { font-size: 0.7rem; color: var(--muted); margin-top: 2px; }
  .tx-right { text-align: right; }
  .tx-amount { font-size: 0.95rem; font-weight: 700; }
  .tx-amount.in { color: var(--green); }
  .tx-amount.out { color: var(--red); }
  .tx-tag {
    display: inline-block; font-size: 0.6rem; padding: 2px 6px; border-radius: 4px;
    margin-top: 3px; background: rgba(201,169,110,0.15); color: var(--gold);
  }

  /* Tabs */
  .tabs { display: flex; gap: 4px; margin-bottom: 16px; flex-wrap: wrap; }
  .tab { 
    padding: 6px 14px; border-radius: 20px; font-size: 0.75rem; cursor: pointer;
    background: var(--card); color: var(--muted); border: 1px solid transparent;
    transition: all 0.2s;
  }
  .tab.active { background: var(--gold); color: var(--bg); font-weight: 600; }

  .footer { text-align: center; font-size: 0.65rem; color: var(--muted); padding: 20px 0 10px; }
  .updated { font-size: 0.6rem; color: var(--muted); text-align: right; margin-top: 8px; }
</style>
</head>
<body>
<div class="container">
  <h1>ARTESALASER</h1>
  <p class="subtitle">Panel financiero · Julio 2026</p>

  <!-- KPI Cards -->
  <div class="kpi-grid">
    <div class="kpi green">
      <div class="kpi-label">Ingresos Totales</div>
      <div class="kpi-value green" id="kpi-ingresos">—</div>
    </div>
    <div class="kpi red">
      <div class="kpi-label">Gastos Totales</div>
      <div class="kpi-value red" id="kpi-gastos">—</div>
    </div>
    <div class="kpi">
      <div class="kpi-label">Beneficio Neto</div>
      <div class="kpi-value gold" id="kpi-beneficio">—</div>
    </div>
    <div class="kpi blue">
      <div class="kpi-label">Pendiente Cobro</div>
      <div class="kpi-value blue" id="kpi-pendiente">—</div>
    </div>
  </div>

  <!-- Chart -->
  <div class="chart-card">
    <h3>📊 Ingresos vs Gastos</h3>
    <div class="chart-wrap"><canvas id="chartBar"></canvas></div>
  </div>

  <!-- Pie Chart -->
  <div class="chart-card">
    <h3>🍰 Distribución por Proyecto</h3>
    <div class="chart-wrap"><canvas id="chartPie"></canvas></div>
  </div>

  <!-- Transactions -->
  <div class="tx-card">
    <h3 style="font-size:0.85rem;color:var(--muted);margin-bottom:12px;text-transform:uppercase;letter-spacing:0.5px;">📋 Últimos movimientos</h3>
    <div id="tx-list"></div>
  </div>

  <div class="updated" id="updated"></div>
  <div class="footer">ARTESALASER · Salamanca · hecho con ❤️</div>
</div>

<script>
// ── DATA ─────────────────────────────────────
const ingresosF = [
  {fecha:"2026-07-02",cliente:"El Arte Coqueto",concepto:"Etiquetas personalizadas + Kit Calendario + Transporte",proyecto:"iAwards",base:86.00,iva:18.06,total:104.06,estado:"Pendiente"},
  {fecha:"2026-07-02",cliente:"ASPACE Salamanca",concepto:"Consultoría Diseño 3D - 4 días (5h)",proyecto:"Servicios",base:700.00,iva:147.00,total:742.00,estado:"Pendiente"},
  {fecha:"2026-07-02",cliente:"Centro Estudios Adams",concepto:"Tutorización curso Placas Solares",proyecto:"Formación",base:250.00,iva:0.00,total:212.50,estado:"Pendiente"},
  {fecha:"2026-07-03",cliente:"El Arte Coqueto",concepto:"Utillaje Hexágono + Kit Cartón 3MM + Transporte",proyecto:"iAwards",base:105.80,iva:22.22,total:128.02,estado:"Pendiente"},
  {fecha:"2026-07-03",cliente:"Asoc. Quimera Ultimate",concepto:"Trofeo Personalizado Madera-Cristal (3 uds)",proyecto:"iAwards",base:105.00,iva:22.05,total:127.05,estado:"Pendiente"},
  {fecha:"2026-07-06",cliente:"AMPA CEIP Villares de la Reina",concepto:"Altavoz BT Personalizado Láser (36 uds)",proyecto:"Personalizados",base:288.00,iva:60.48,total:348.48,estado:"Pendiente"},
  {fecha:"2026-07-08",cliente:"Real Fed. Española de Hockey",concepto:"Placas personalizadas color+láser (2 uds)",proyecto:"iAwards",base:44.00,iva:9.24,total:53.24,estado:"Pendiente"},
  {fecha:"2026-07-13",cliente:"BELLALUNA",concepto:"Guías metacrilato + biseladas + Esquinera + Transporte",proyecto:"Personalizados",base:310.80,iva:65.27,total:376.07,estado:"Pendiente"},
  {fecha:"2026-07-13",cliente:"Mª Rosario Martínez",concepto:"BRIIK Genérico colores variados (10 uds) + Transporte",proyecto:"BRIIK",base:71.80,iva:15.08,total:86.88,estado:"Pendiente"},
  {fecha:"2026-07-16",cliente:"GLOBALIA ARTES GRAFICAS SLU",concepto:"Plantillas y grabado láser bolígrafos (74 uds) + vasos (4 uds)",proyecto:"Personalizados",base:77.00,iva:16.17,total:93.17,estado:"Pendiente"},
  {fecha:"2026-07-17",cliente:"El Arte Coqueto",concepto:"Kit Cartón 3MM + Círculos + Aros + Transporte",proyecto:"iAwards",base:156.80,iva:32.93,total:189.73,estado:"Pendiente"},
  {fecha:"2026-07-23",cliente:"El Arte Coqueto",concepto:"Kit Cartón 3MM MC (20 uds) + Transporte",proyecto:"iAwards",base:147.80,iva:31.04,total:178.84,estado:"Pendiente"},
  {fecha:"2026-07-24",cliente:"NIEBLA CB",concepto:"QR personalizado ABS bicapa (18 uds) + QR Haya marco 3D (12 uds)",proyecto:"iAwards",base:226.20,iva:47.50,total:273.70,estado:"Pendiente"},
  {fecha:"2026-07-24",cliente:"GLOBALIA ARTES GRAFICAS SLU",concepto:"Impresión placas color (6 uds)",proyecto:"Personalizados",base:72.00,iva:15.12,total:87.12,estado:"Pendiente"},
];
const ingresosNF = [
  {fecha:"2026-07-16",cliente:"Particular",concepto:"Grabado metacrilato pintado",proyecto:"Personalizados",importe:20.00,notas:"Sin factura"},
  {fecha:"2026-07-27",cliente:"Cestería Clara",concepto:"Eguzquilore 270MM DM 5 (3 PIEZAS) - 87 uds",proyecto:"ARTESALASER",importe:361.05,notas:"Sin IVA - Sin factura"},
];
const gastos = [
  {fecha:"2026-07-08",proveedor:"FRAMUN S.A.",concepto:"Planchas metacrilato + Lasermax",categoria:"Materiales",total:200.38},
  {fecha:"2026-07-16",proveedor:"DonDominio",concepto:"Renovacion dominio (briik.es)",categoria:"Dominios",total:4.17},
  {fecha:"2026-07-01",proveedor:"Luis Ángel Junco Sánchez",concepto:"Alquiler nave julio 2026 (IRPF -19%)",categoria:"Alquiler",total:561.00},
  {fecha:"2026-07-14",proveedor:"Porras Estampación (DTF Rápido)",concepto:"Completa tu pedido #2550",categoria:"Materiales",total:7.25},
  {fecha:"2026-07-16",proveedor:"MKTO CATAL IMPORTACIONES",concepto:"Cajas presentación + Ratón + Bolsas",categoria:"Materiales",total:19.38},
  {fecha:"2026-07-20",proveedor:"DonDominio",concepto:"Mail unomas.digital (1 año)",categoria:"Suscripciones",total:12.10},
  {fecha:"2026-07-21",proveedor:"Porras Estampación (DTF Rápido)",concepto:"DTF UV por centímetros #3040",categoria:"Materiales",total:14.52},
  {fecha:"2026-07-27",proveedor:"DeepSeek",concepto:"API ~285M tokens (sem 20-27 jul)",categoria:"API",total:157.48},
  {fecha:"2026-07-27",proveedor:"MiniMax",concepto:"API ~27K tokens (sem 20-27 jul)",categoria:"API",total:0.01},
];

// ── CALCULATE ───────────────────────────────
const totalIF = ingresosF.reduce((s,i)=>s+i.total,0);
const totalINF = ingresosNF.reduce((s,i)=>s+i.importe,0);
const totalGastos = gastos.reduce((s,g)=>s+g.total,0);
const pendiente = ingresosF.filter(i=>i.estado==="Pendiente").reduce((s,i)=>s+i.total,0);
const beneficio = totalIF + totalINF - totalGastos;

document.getElementById('kpi-ingresos').textContent = (totalIF+totalINF).toLocaleString('es-ES',{style:'currency',currency:'EUR'});
document.getElementById('kpi-gastos').textContent = totalGastos.toLocaleString('es-ES',{style:'currency',currency:'EUR'});
document.getElementById('kpi-beneficio').textContent = beneficio.toLocaleString('es-ES',{style:'currency',currency:'EUR'});
document.getElementById('kpi-pendiente').textContent = pendiente.toLocaleString('es-ES',{style:'currency',currency:'EUR'});
document.getElementById('updated').textContent = 'Actualizado: ' + new Date().toLocaleString('es-ES');

// ── BAR CHART ───────────────────────────────
new Chart(document.getElementById('chartBar'), {
  type: 'bar',
  data: {
    labels: ['Facturado','Sin factura','Gastos','Beneficio'],
    datasets: [{
      data: [totalIF, totalINF, -totalGastos, beneficio],
      backgroundColor: ['#2ecc71','#3498db','#e74c3c','#c9a96e'],
      borderRadius: 8, borderSkipped: false,
    }]
  },
  options: {
    responsive: true, maintainAspectRatio: false,
    plugins: { legend: { display: false } },
    scales: {
      y: { 
        grid: { color: 'rgba(255,255,255,0.05)' },
        ticks: { color: '#8b8b9e', callback: v => v+'€' }
      },
      x: { ticks: { color: '#8b8b9e', font: { size: 11 } }, grid: { display: false } }
    }
  }
});

// ── PIE CHART ───────────────────────────────
const proyectos = {};
ingresosF.forEach(i => { proyectos[i.proyecto] = (proyectos[i.proyecto]||0) + i.total; });
ingresosNF.forEach(i => { proyectos[i.proyecto] = (proyectos[i.proyecto]||0) + i.importe; });
const colors = ['#c9a96e','#2a9d8f','#e07a5f','#3498db','#9b59b6'];

new Chart(document.getElementById('chartPie'), {
  type: 'doughnut',
  data: {
    labels: Object.keys(proyectos),
    datasets: [{
      data: Object.values(proyectos),
      backgroundColor: colors.slice(0, Object.keys(proyectos).length),
      borderColor: '#0f0f1a', borderWidth: 2,
    }]
  },
  options: {
    responsive: true, maintainAspectRatio: false,
    plugins: { 
      legend: { position: 'bottom', labels: { color: '#e8e0d5', padding: 16, font: { size: 11 } } }
    }
  }
});

// ── TRANSACTIONS ────────────────────────────
const allTx = [
  ...ingresosF.map(i=>({...i, tipo:'in', monto:i.total, nombre:i.cliente, detalle:i.concepto, tag:i.proyecto})),
  ...ingresosNF.map(i=>({...i, tipo:'in', monto:i.importe, nombre:i.cliente, detalle:i.concepto, tag:i.proyecto})),
  ...gastos.map(g=>({...g, tipo:'out', monto:-g.total, nombre:g.proveedor, detalle:g.concepto, tag:g.categoria})),
].sort((a,b)=>new Date(b.fecha)-new Date(a.fecha));

const txList = document.getElementById('tx-list');
allTx.forEach(tx => {
  const div = document.createElement('div');
  div.className = 'tx-row';
  div.innerHTML = `
    <div class="tx-left">
      <div class="tx-name">${tx.nombre}</div>
      <div class="tx-detail">${tx.detalle} · ${tx.fecha.split('-').reverse().join('/')}</div>
      <span class="tx-tag">${tx.tag}</span>
    </div>
    <div class="tx-right">
      <div class="tx-amount ${tx.tipo==='in'?'in':'out'}">${tx.monto.toLocaleString('es-ES',{style:'currency',currency:'EUR'})}</div>
    </div>
  `;
  txList.appendChild(div);
});
</script>
</body>
</html>
