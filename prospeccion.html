<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f0f0f; color: #e0e0e0; padding: 20px; max-width: 1300px; margin: 0 auto; }
.header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; flex-wrap: wrap; gap: 10px; }
.header h1 { font-size: 1.3em; color: #fff; }
.date { color: #888; font-size: 0.8em; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 16px; }
.card { background: #1a1a1a; border-radius: 10px; padding: 12px; border: 1px solid #2a2a2a; }
.card .label { font-size: 0.65em; color: #888; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 3px; }
.card .value { font-size: 1.6em; font-weight: 700; }
.card .sub { font-size: 0.7em; color: #666; margin-top: 2px; }
.briik-card { border-left: 3px solid #6B7DAF; }
.iawards-card { border-left: 3px solid #CC3333; }
.total-card { border-left: 3px solid #4CAF50; }
.blue { color: #6B7DAF; } .red { color: #CC3333; } .green { color: #4CAF50; } .yellow { color: #FFC107; }
.filters { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 16px; align-items: center; background: #1a1a1a; padding: 12px 14px; border-radius: 10px; border: 1px solid #2a2a2a; }
.filters label { font-size: 0.7em; color: #888; text-transform: uppercase; margin-right: 4px; }
.filters select, .filters input { background: #0f0f0f; border: 1px solid #333; color: #e0e0e0; padding: 6px 10px; border-radius: 6px; font-size: 0.8em; }
.filters select:focus, .filters input:focus { outline: none; border-color: #6B7DAF; }
.filter-group { display: flex; align-items: center; gap: 5px; }
.btn-reset { background: #2a2a2a; border: 1px solid #444; color: #999; padding: 6px 12px; border-radius: 6px; font-size: 0.75em; cursor: pointer; }
.btn-reset:hover { background: #333; color: #fff; }
.table-wrapper { overflow-x: auto; margin-bottom: 20px; }
table { width: 100%; border-collapse: collapse; font-size: 0.78em; }
th { background: #1a1a1a; color: #888; font-weight: 600; text-align: left; padding: 7px 10px; border-bottom: 1px solid #2a2a2a; font-size: 0.7em; text-transform: uppercase; letter-spacing: 0.5px; cursor: pointer; white-space: nowrap; }
th:hover { color: #fff; }
th .sort-arrow { margin-left: 3px; opacity: 0.4; }
th.sorted .sort-arrow { opacity: 1; }
td { padding: 5px 10px; border-bottom: 1px solid #1a1a1a; white-space: nowrap; }
tr:hover { background: #141414; }
.tag { display: inline-block; padding: 2px 7px; border-radius: 10px; font-size: 0.7em; font-weight: 600; }
.tag-enviado { background: #1a3a1a; color: #4CAF50; }
.tag-respondido { background: #3a2a0a; color: #FFC107; }
.tag-positivo { background: #1a3a2a; color: #66BB6A; }
.tag-rebote { background: #3a1a1a; color: #EF5350; }
.summary-row { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; font-size: 0.78em; }
.summary-item { display: flex; align-items: center; gap: 4px; }
.count-badge { background: #2a2a2a; padding: 1px 8px; border-radius: 8px; font-weight: 700; font-size: 0.9em; }
.footer { margin-top: 30px; padding-top: 15px; border-top: 1px solid #1a1a1a; text-align: center; font-size: 0.7em; color: #555; }
.no-results { text-align: center; padding: 30px; color: #666; display: none; }
.result-info { font-size: 0.75em; color: #888; margin-bottom: 6px; }
@media (max-width: 600px) {
  .filters { flex-direction: column; align-items: flex-start; }
  .header h1 { font-size: 1.1em; }
}
</style>

  <div class="filter-group"><label>Hasta</label><input type="date" id="filter-to"></div>
  <div class="filter-group"><label>Buscar</label><input type="text" id="filter-search" placeholder="Nombre o email..." style="width:150px;"></div>
  <button class="btn-reset" onclick="resetFilters()">✕ Limpiar</button>
</div>

<div class="result-info" id="result-info"></div>

<div class="table-wrapper">
  <table>
    <thead><tr>
      <th onclick="sortTable(0)" id="th-date">Fecha <span class="sort-arrow">▼</span></th>

      <th onclick="sortTable(3)">Nombre</th>

    </tr></thead>
    <tbody id="data-table"></tbody>
  </table>
  <div class="no-results" id="no-results">Sin resultados para estos filtros</div>
</div>

<div class="footer">Actualizado: 27 julio 2026 · Los datos se actualizan con cada envío</div>

let filteredData = [...allData];
let sortCol = 0;
let sortDir = -1;

const cities = [...new Set(allData.map(d=>d.city))].sort();
const citySelect = document.getElementById('filter-city');
cities.forEach(c => { const o = document.createElement('option'); o.value=c; o.textContent=c; citySelect.appendChild(o); });

const dates = allData.map(d=>d.date).sort();
document.getElementById('filter-from').value = dates[0];
document.getElementById('filter-to').value = dates[dates.length-1];

function applyFilters() {
  const brand = document.getElementById('filter-brand').value;
  const city = document.getElementById('filter-city').value;
  const status = document.getElementById('filter-status').value;
  const from = document.getElementById('filter-from').value;
  const to = document.getElementById('filter-to').value;
  const search = document.getElementById('filter-search').value.toLowerCase();
  
  filteredData = allData.filter(d => {
    if (brand !== 'all' && d.brand !== brand) return false;
    if (city !== 'all' && d.city !== city) return false;
    if (status === 'Enviado' && d.status !== 'Enviado') return false;
    if (status === 'Interesada' && !d.notes.includes('INTERESADA') && !d.notes.includes('interesada') && d.notes !== 'Interesada') return false;
    if (status === 'No interesa' && !d.notes.includes('No interesa') && !d.notes.includes('No trabaja')) return false;
    if (from && d.date < from) return false;
    if (to && d.date > to) return false;
    if (search && !d.name.toLowerCase().includes(search) && !d.email.toLowerCase().includes(search) && !d.notes.toLowerCase().includes(search)) return false;
    return true;
  });
  
  const keyMap = ['date','brand','city','name','','score','status','notes'];
  const key = keyMap[sortCol] || 'date';
  filteredData.sort((a,b) => {
    let va = a[key]||'', vb = b[key]||'';
    if (key === 'score') { va = parseInt(va)||0; vb = parseInt(vb)||0; return (va-vb)*sortDir; }
    return va.localeCompare(vb) * sortDir;
  });
  
  render();
}

function render() {
  const tbody = document.getElementById('data-table');
  const noRes = document.getElementById('no-results');
  tbody.innerHTML = '';
  
  if (filteredData.length === 0) {
    noRes.style.display = 'block';
    document.getElementById('result-info').textContent = '';
    updateKPIs();
    return;
  }
  noRes.style.display = 'none';
  document.getElementById('result-info').textContent = 'Mostrando ' + filteredData.length + ' de ' + allData.length + ' contactos';
  
  filteredData.forEach(d => {
    const tr = document.createElement('tr');
    const tag = d.status === 'Enviado' ? 'tag-enviado' : 'tag-respondido';
    const brandColor = d.brand === 'BRIIK' ? '#6B7DAF' : '#CC3333';
    let noteTag = '';
    if (d.notes.includes('INTERESADA') || d.notes.includes('interesada')) noteTag = 'tag-positivo';
    else if (d.notes.includes('No interesa') || d.notes.includes('No trabaja')) noteTag = 'tag-rebote';
    else if (d.notes.includes('Auto-respuesta')) noteTag = 'tag-respondido';
    
    tr.innerHTML = '<td>'+d.date.split('-').reverse().slice(0,2).join('/')+'</td>'+
      '<td style="color:'+brandColor+';font-weight:600;">'+d.brand+'</td>'+
      '<td>'+d.city+'</td>'+
      '<td>'+d.name+'</td>'+
      '<td style="font-size:0.8em;color:#aaa;">'+d.email+'</td>'+
      '<td>'+d.score+'</td>'+
      '<td><span class="tag '+tag+'">'+d.status+'</span></td>'+
      '<td>'+(noteTag?'<span class="tag '+noteTag+'">'+d.notes+'</span>':d.notes)+'</td>';
    tbody.appendChild(tr);
  });
  updateKPIs();
}

function updateKPIs() {
  const total = filteredData.length;
  const briik = filteredData.filter(d=>d.brand==='BRIIK').length;
  const iawards = filteredData.filter(d=>d.brand==='iAwards').length;
  const replies = filteredData.filter(d=>d.notes).length;
  
  document.getElementById('kpi-briik').textContent = briik;
  document.getElementById('kpi-iawards').textContent = iawards;
  document.getElementById('kpi-total').textContent = total;
  document.getElementById('kpi-replies').textContent = replies;
  document.getElementById('kpi-rate').textContent = total>0?Math.round(replies/total*100)+'%':'0%';
  
  const citySet = [...new Set(filteredData.map(d=>d.city))];
  document.getElementById('kpi-briik-sub').textContent = citySet.filter(c=>c!=='CyL').join(' · ')||'-';
  document.getElementById('kpi-iawards-sub').textContent = citySet.filter(c=>c==='CyL').join(' · ')||'-';
  document.getElementById('kpi-total-sub').textContent = citySet.length+' regiones';
  document.getElementById('kpi-replies-sub').textContent = filteredData.filter(d=>d.notes.includes('INTERESADA')||d.notes.includes('interesada')).length+' interes';
  document.getElementById('kpi-rate-sub').textContent = 'Sobre '+total+' envios';
}

function sortTable(col) {
  if (sortCol === col) sortDir *= -1;
  else { sortCol = col; sortDir = col===0?-1:1; }
  document.querySelectorAll('th').forEach(th=>th.classList.remove('sorted'));
  applyFilters();
}

function resetFilters() {
  document.getElementById('filter-brand').value='all';
  document.getElementById('filter-city').value='all';
  document.getElementById('filter-status').value='all';
  document.getElementById('filter-from').value=dates[0];
  document.getElementById('filter-to').value=dates[dates.length-1];
  document.getElementById('filter-search').value='';
  applyFilters();
}

['filter-brand','filter-city','filter-status','filter-from','filter-to'].forEach(id=>{
  document.getElementById(id).addEventListener('change',applyFilters);
});
document.getElementById('filter-search').addEventListener('input',applyFilters);

applyFilters();
</script>
