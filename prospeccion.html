<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f0f0f; color: #e0e0e0; padding: 20px; max-width: 1300px; margin: 0 auto; }
.header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; flex-wrap: wrap; gap: 10px; }
.header h1 { font-size: 1.3em; color: #fff; }
.date { color: #888; font-size: 0.8em; }

/* Tabs */
.tabs { display: flex; gap: 0; margin-bottom: 16px; border-bottom: 1px solid #2a2a2a; }
.tab { padding: 8px 20px; background: none; border: none; color: #888; cursor: pointer; font-size: 0.85em; font-family: inherit; border-bottom: 2px solid transparent; transition: all 0.2s; }
.tab:hover { color: #ccc; }
.tab.active { color: #fff; border-bottom-color: #6B7DAF; }
.tab-content { display: none; }
.tab-content.active { display: block; }

/* KPIs */
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 16px; }
.card { background: #1a1a1a; border-radius: 10px; padding: 12px; border: 1px solid #2a2a2a; }
.card .label { font-size: 0.65em; color: #888; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 3px; }
.card .value { font-size: 1.6em; font-weight: 700; }
.card .sub { font-size: 0.7em; color: #666; margin-top: 2px; }
.briik-card { border-left: 3px solid #6B7DAF; }
.iawards-card { border-left: 3px solid #CC3333; }
.total-card { border-left: 3px solid #4CAF50; }
.blue { color: #6B7DAF; } .red { color: #CC3333; } .green { color: #4CAF50; } .yellow { color: #FFC107; } .orange { color: #FF9800; }

/* Filters */
.filters { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 16px; align-items: center; background: #1a1a1a; padding: 12px 14px; border-radius: 10px; border: 1px solid #2a2a2a; }
.filters label { font-size: 0.7em; color: #888; text-transform: uppercase; margin-right: 4px; }
.filters select, .filters input { background: #0f0f0f; border: 1px solid #333; color: #e0e0e0; padding: 6px 10px; border-radius: 6px; font-size: 0.8em; }
.filters select:focus, .filters input:focus { outline: none; border-color: #6B7DAF; }
.filter-group { display: flex; align-items: center; gap: 5px; }
.btn-reset { background: #2a2a2a; border: 1px solid #444; color: #999; padding: 6px 12px; border-radius: 6px; font-size: 0.75em; cursor: pointer; }
.btn-reset:hover { background: #333; color: #fff; }

/* Batch actions */
.batch-actions { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; align-items: center; }
.batch-actions span { font-size: 0.75em; color: #888; margin-right: 8px; }
.btn-action { background: #1a1a1a; border: 1px solid #333; color: #ccc; padding: 5px 12px; border-radius: 6px; font-size: 0.75em; cursor: pointer; font-family: inherit; transition: all 0.15s; }
.btn-action:hover { background: #2a2a2a; border-color: #555; color: #fff; }
.btn-approve { border-color: #4CAF50; color: #4CAF50; }
.btn-approve:hover { background: #1a2a1a; }
.btn-reject { border-color: #EF5350; color: #EF5350; }
.btn-reject:hover { background: #2a1a1a; }
.btn-modify { border-color: #FF9800; color: #FF9800; }
.btn-modify:hover { background: #2a2a1a; }
.btn-view { border-color: #6B7DAF; color: #6B7DAF; }
.btn-view:hover { background: #1a1a2a; }
.btn-copied { background: #1a3a1a !important; border-color: #4CAF50 !important; color: #4CAF50 !important; }

/* Table */
.table-wrapper { overflow-x: auto; margin-bottom: 20px; }
table { width: 100%; border-collapse: collapse; font-size: 0.78em; }
th { background: #1a1a1a; color: #888; font-weight: 600; text-align: left; padding: 7px 10px; border-bottom: 1px solid #2a2a2a; font-size: 0.7em; text-transform: uppercase; letter-spacing: 0.5px; cursor: pointer; white-space: nowrap; }
th:hover { color: #fff; }
td { padding: 5px 10px; border-bottom: 1px solid #1a1a1a; white-space: nowrap; }
tr:hover { background: #141414; }
tr.selected { background: #1a1a2a; }
tr.expandable { cursor: pointer; }
tr.expandable:hover { background: #181818; }

/* Expand */
.expand-row { display: none; }
.expand-row.open { display: table-row; }
.expand-row td { padding: 0; }
.expand-content { background: #141414; border: 1px solid #2a2a2a; border-radius: 6px; margin: 8px 12px; padding: 14px; }
.expand-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.expand-grid .field { margin-bottom: 6px; }
.expand-grid .field-label { font-size: 0.65em; color: #666; text-transform: uppercase; letter-spacing: 0.5px; }
.expand-grid .field-value { font-size: 0.8em; color: #ccc; word-break: break-word; }
.expand-full { grid-column: 1 / -1; }
.expand-body { background: #0f0f0f; border: 1px solid #1a1a1a; border-radius: 4px; padding: 12px; font-size: 0.85em; color: #ccc; white-space: pre-wrap; line-height: 1.5; margin-top: 4px; }
.expand-actions { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }

/* Tags */
.tag { display: inline-block; padding: 2px 7px; border-radius: 10px; font-size: 0.7em; font-weight: 600; }
.tag-drafted { background: #1a1a2a; color: #6B7DAF; }
.tag-needs_review { background: #2a2a1a; color: #FF9800; }
.tag-approved { background: #1a3a1a; color: #4CAF50; }
.tag-rejected { background: #3a1a1a; color: #EF5350; }
.tag-sent { background: #1a3a1a; color: #4CAF50; }
.tag-replied { background: #3a2a0a; color: #FFC107; }
.tag-bounced { background: #3a1a1a; color: #EF5350; }
.tag-blocked { background: #2a2a2a; color: #888; }
.tag-error { background: #3a0000; color: #FF5252; }
.tag-verification-official { background: #1a3a1a; color: #4CAF50; }
.tag-verification-directory { background: #1a2a3a; color: #6B7DAF; }

.no-results { text-align: center; padding: 30px; color: #666; display: none; }
.result-info { font-size: 0.75em; color: #888; margin-bottom: 6px; }
.check-col { width: 30px; }
.footer { margin-top: 30px; padding-top: 15px; border-top: 1px solid #1a1a1a; text-align: center; font-size: 0.7em; color: #555; }
@media (max-width: 600px) {
  .filters { flex-direction: column; align-items: flex-start; }
  .header h1 { font-size: 1.1em; }
  .expand-grid { grid-template-columns: 1fr; }
  .batch-actions { flex-direction: column; }
}
</style>
</head>

function switchTab(tab) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
  document.querySelector(`[onclick="switchTab('${tab}')"]`).classList.add('active');
  document.getElementById('tab-' + tab).classList.add('active');
  if (tab === 'revisar') renderReview();
  if (tab === 'enviados') renderSent();
}

let expandedId = null;
let selectedIds = new Set();

function renderReview() {
  if (!draftsData.length) { updateReviewKPIs(); return; }
  updateReviewKPIs();

  // Filters
  const runIds = [...new Set(draftsData.map(d => d.id?.split('-').slice(0,3).join('-') || ''))];
  const brands = [...new Set(draftsData.map(d => d.brand))];
  const fi = document.getElementById('filters-review');
  let brandOpts = brands.map(b => `<option value="${b}">${b}</option>`).join('');
  let runOpts = runIds.map(r => `<option value="${r}">${r}</option>`).join('');
  fi.innerHTML = `
    <div class="filter-group"><label>Marca</label><select id="rev-filter-brand" onchange="applyReviewFilters()"><option value="all">Todas</option>${brandOpts}</select></div>
    <div class="filter-group"><label>Tanda</label><select id="rev-filter-run" onchange="applyReviewFilters()"><option value="all">Todas</option>${runOpts}</select></div>
    <div class="filter-group"><label>Puntuación</label><select id="rev-filter-score" onchange="applyReviewFilters()"><option value="all">Todas</option><option value="80">≥ 80</option><option value="65">≥ 65</option></select></div>
    <div class="filter-group"><label>Estado</label><select id="rev-filter-status" onchange="applyReviewFilters()"><option value="all">Todos</option><option value="drafted">drafted</option><option value="needs_review">needs_review</option></select></div>
    <button class="btn-reset" onclick="resetReviewFilters()">✕ Limpiar</button>
  `;

  applyReviewFilters();
}

function applyReviewFilters() {
  const brand = document.getElementById('rev-filter-brand')?.value || 'all';
  const run = document.getElementById('rev-filter-run')?.value || 'all';
  const score = document.getElementById('rev-filter-score')?.value || 'all';
  const status = document.getElementById('rev-filter-status')?.value || 'all';

  let filtered = draftsData;
  if (brand !== 'all') filtered = filtered.filter(d => d.brand === brand);
  if (run !== 'all') filtered = filtered.filter(d => (d.id || '').startsWith(run));
  if (score !== 'all') filtered = filtered.filter(d => (d.score || 0) >= parseInt(score));
  if (status !== 'all') filtered = filtered.filter(d => d.status === status);

  const tbody = document.getElementById('review-table');
  tbody.innerHTML = '';

  if (!filtered.length) {
    document.getElementById('no-results-review').style.display = 'block';
    document.getElementById('result-info-review').textContent = '';
    return;
  }
  document.getElementById('no-results-review').style.display = 'none';
  document.getElementById('result-info-review').textContent = 'Mostrando ' + filtered.length + ' de ' + draftsData.length + ' borradores';

  const runId = draftRuns[0]?.run_id || '';

  filtered.forEach(d => {
    const brandColor = d.brand === 'briik' ? '#6B7DAF' : '#CC3333';
    const brandLabel = d.brand === 'briik' ? 'BRIIK' : 'iAwards';
    const verifLabel = d.email_verification === 'official' ? 'Oficial' : d.email_verification === 'official_directory' ? 'Directorio' : d.email_verification || '';
    const verifClass = d.email_verification === 'official' ? 'tag-verification-official' : 'tag-verification-directory';
    const statusLabel = d.status === 'needs_review' ? '⚠️ revisar' : 'drafted';
    const statusClass = d.status === 'needs_review' ? 'tag-needs_review' : 'tag-drafted';
    const checked = selectedIds.has(d.id) ? 'checked' : '';

    // Main row
    const tr = document.createElement('tr');
    tr.className = 'expandable';
    tr.setAttribute('data-id', d.id);
    tr.onclick = (e) => { if (e.target.tagName !== 'INPUT') toggleExpand(d.id); };
    tr.innerHTML = `
      <td class="check-col" onclick="event.stopPropagation()"><input type="checkbox" ${checked} onchange="toggleSelect('${d.id}', this.checked)"></td>
      <td style="font-size:0.75em;color:#888;">${d.id}</td>
      <td style="color:${brandColor};font-weight:600;">${brandLabel}</td>
      <td>${d.organization}</td>
      <td>${d.city}</td>
      <td style="font-size:0.8em;">${d.segment}</td>
      <td>${d.score}</td>
      <td><span class="tag ${verifClass}">${verifLabel}</span></td>
      <td><span class="tag ${statusClass}">${statusLabel}</span></td>
    `;
    tbody.appendChild(tr);

    // Expand row
    const expTr = document.createElement('tr');
    expTr.className = 'expand-row';
    expTr.id = 'exp-' + d.id;
    expTr.innerHTML = `
      <td colspan="9">
        <div class="expand-content">
          <div class="expand-grid">
            <div class="field">
              <div class="field-label">Evidencia</div>
              <div class="field-value">${d.evidence || ''} <a href="${d.evidence_url || '#'}" target="_blank" style="color:#6B7DAF;font-size:0.8em;">[fuente]</a></div>
            </div>
            <div class="field">
              <div class="field-label">Email · Verificación</div>
              <div class="field-value">${d.email || ''} <span class="tag ${verifClass}">${verifLabel}</span> <a href="${d.email_source_url || '#'}" target="_blank" style="color:#6B7DAF;font-size:0.8em;">[fuente]</a></div>
            </div>
            <div class="field expand-full">
              <div class="field-label">Asunto</div>
              <div class="field-value" style="font-weight:600;">${d.subject || ''}</div>
            </div>
            <div class="field expand-full">
              <div class="field-label">Cuerpo</div>
              <div class="expand-body">${d.body || ''}</div>
            </div>
            <div class="field">
              <div class="field-label">Adjunto</div>
              <div class="field-value">📎 ${d.attachment || 'N/A'}</div>

            <div class="field">
              <div class="field-label">Hash</div>
              <div class="field-value" style="font-size:0.7em;color:#555;">${d.draft_hash || ''}</div>
            </div>
            ${d.review_issue ? `<div class="field expand-full"><div class="field-label" style="color:#FF9800;">⚠️ Incidencia</div><div class="field-value" style="color:#FF9800;">${d.review_issue}</div></div>` : ''}
          </div>
          <div class="expand-actions">
            <button class="btn-action btn-approve" onclick="event.stopPropagation(); copyCmd('APROBAR ${d.id}')">📋 Copiar APROBAR</button>
            <button class="btn-action btn-modify" onclick="event.stopPropagation(); copyCmd('MODIFICAR ${d.id}: ')">📋 Copiar MODIFICAR</button>

function toggleExpand(id) {
  const row = document.getElementById('exp-' + id);
  if (!row) return;
  const isOpen = row.classList.contains('open');
  // Close all
  document.querySelectorAll('.expand-row.open').forEach(r => r.classList.remove('open'));
  if (!isOpen) row.classList.add('open');
  expandedId = isOpen ? null : id;
}

function toggleSelect(id, checked) {
  if (checked) selectedIds.add(id);
  else selectedIds.delete(id);
  updateSelectAllCheck();
}

function toggleAllCheck(el) {
  if (el.checked) {
    draftsData.forEach(d => selectedIds.add(d.id));
  } else {
    selectedIds.clear();
  }
  applyReviewFilters();
}

function updateSelectAllCheck() {
  const all = document.getElementById('select-all-check');
  if (all) all.checked = selectedIds.size === draftsData.length && draftsData.length > 0;
}

function selectAll() { draftsData.forEach(d => selectedIds.add(d.id)); applyReviewFilters(); }
function selectNone() { selectedIds.clear(); applyReviewFilters(); }

function copyCmd(text) {
  navigator.clipboard.writeText(text).then(() => {
    // Brief visual feedback
  }).catch(() => {});
}

function copyCommand(type) {
  const runId = draftRuns[0]?.run_id || '';
  if (type === 'APROBAR_TODO') {
    copyCmd('APROBAR ' + runId + ' TODO');
  }
}

let filteredSent = [...allData];
let sortCol = 0;
let sortDir = -1;

function initSentFilters() {
  const cities = [...new Set(allData.map(d=>d.city))].sort();
  const citySelect = document.getElementById('filter-city');
  citySelect.innerHTML = '<option value="all">Todas</option>';
  cities.forEach(c => { const o = document.createElement('option'); o.value=c; o.textContent=c; citySelect.appendChild(o); });
  const dates = allData.map(d=>d.date).sort();
  document.getElementById('filter-from').value = dates[0];
  document.getElementById('filter-to').value = dates[dates.length-1];
  applySentFilters();
}

function applySentFilters() {
  const brand = document.getElementById('filter-brand').value;
  const city = document.getElementById('filter-city').value;
  const status = document.getElementById('filter-status').value;
  const from = document.getElementById('filter-from').value;
  const to = document.getElementById('filter-to').value;
  const search = document.getElementById('filter-search').value.toLowerCase();

  filteredSent = allData.filter(d => {
    if (brand !== 'all' && d.brand !== brand) return false;
    if (city !== 'all' && d.city !== city) return false;
    if (status === 'Enviado' && d.status !== 'Enviado') return false;
    if (status === 'Interesada' && !d.notes.toLowerCase().includes('interesada')) return false;
    if (status === 'No interesa' && !d.notes.toLowerCase().includes('no interesa') && !d.notes.toLowerCase().includes('no trabaja')) return false;
    if (from && d.date < from) return false;
    if (to && d.date > to) return false;
    if (search && !d.name.toLowerCase().includes(search) && !d.email.toLowerCase().includes(search) && !d.notes.toLowerCase().includes(search)) return false;
    return true;
  });

  const keyMap = ['date','brand','city','name','','score','status','notes'];
  const key = keyMap[sortCol] || 'date';
  filteredSent.sort((a,b) => {
    let va = a[key]||'', vb = b[key]||'';
    if (key === 'score') { va = parseInt(va)||0; vb = parseInt(vb)||0; return (va-vb)*sortDir; }
    return String(va).localeCompare(String(vb)) * sortDir;
  });

  renderSent();
}

function renderSent() {
  const tbody = document.getElementById('sent-table');
  document.getElementById('sent-table').innerHTML = '';
  document.getElementById('no-results-sent').style.display = filteredSent.length ? 'none' : 'block';
  document.getElementById('result-info-sent').textContent = filteredSent.length ? 'Mostrando ' + filteredSent.length + ' de ' + allData.length + ' contactos' : '';

  filteredSent.forEach(d => {
    const tr = document.createElement('tr');
    const tag = d.status === 'Enviado' ? 'tag-sent' : 'tag-replied';
    const brandColor = d.brand === 'BRIIK' ? '#6B7DAF' : '#CC3333';
    let noteTag = '';
    if (d.notes.toLowerCase().includes('interesada')) noteTag = 'tag-replied';
    else if (d.notes.toLowerCase().includes('no interesa') || d.notes.toLowerCase().includes('no trabaja')) noteTag = 'tag-rejected';
    const maskedEmail = d.email ? d.email.replace(/(..).*(@.*)/, '$1***$2') : '';

    tr.innerHTML = `<td>${d.date.split('-').reverse().slice(0,2).join('/')}</td>
      <td style="color:${brandColor};font-weight:600;">${d.brand}</td>
      <td>${d.city}</td>
      <td>${d.name}</td>
      <td style="font-size:0.8em;color:#aaa;">${maskedEmail}</td>
      <td>${d.score}</td>
      <td><span class="tag ${tag}">${d.status}</span></td>
      <td>${noteTag?'<span class="tag '+noteTag+'">'+d.notes+'</span>':d.notes}</td>`;
    tbody.appendChild(tr);
  });
  updateSentKPIs();
}

function sortSent(col) {
  if (sortCol === col) sortDir *= -1;
  else { sortCol = col; sortDir = col===0?-1:1; }
  applySentFilters();
}

function resetFilters() {
  ['filter-brand','filter-city','filter-status'].forEach(id => document.getElementById(id).value='all');
  const dates = allData.map(d=>d.date).sort();
  document.getElementById('filter-from').value = dates[0];
  document.getElementById('filter-to').value = dates[dates.length-1];
  document.getElementById('filter-search').value = '';
  applySentFilters();
}

function updateSentKPIs() {
  const total = filteredSent.length;
  const briik = filteredSent.filter(d=>d.brand==='BRIIK').length;
  const iawards = filteredSent.filter(d=>d.brand==='iAwards').length;
  const replies = filteredSent.filter(d=>d.notes).length;
  const interest = filteredSent.filter(d=>d.notes.toLowerCase().includes('interesada')).length;
  const overallTotal = allData.length;

  document.getElementById('kpi-sent').innerHTML = `
    <div class="card briik-card"><div class="label">BRIIK Enviados</div><div class="value blue">${allData.filter(d=>d.brand==='BRIIK').length}</div><div class="sub">${briik} en filtro</div></div>
    <div class="card iawards-card"><div class="label">iAwards Enviados</div><div class="value red">${allData.filter(d=>d.brand==='iAwards').length}</div><div class="sub">${iawards} en filtro</div></div>
    <div class="card total-card"><div class="label">Total histórico</div><div class="value green">${overallTotal}</div><div class="sub">${total} en filtro</div></div>
    <div class="card" style="border-left:3px solid #FFC107;"><div class="label">Respuestas</div><div class="value yellow">${replies}</div><div class="sub">${interest} interés · ${overallTotal>0?Math.round(replies/overallTotal*100):0}% tasa</div></div>
  `;
}

// ============================================================
// INIT
// ============================================================
['filter-brand','filter-city','filter-status','filter-from','filter-to'].forEach(id => {
  const el = document.getElementById(id);
  if (el) el.addEventListener('change', applySentFilters);
});
document.getElementById('filter-search')?.addEventListener('input', applySentFilters);

loadDrafts();
initSentFilters();
</script>
