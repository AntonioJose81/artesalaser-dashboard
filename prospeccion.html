<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f0f0f; color: #e0e0e0; padding: 12px; max-width: 1300px; margin: 0 auto; }
.header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; flex-wrap: wrap; gap: 8px; }
.header h1 { font-size: 1.15em; color: #fff; }
.date { color: #888; font-size: 0.7em; }
.update-info { font-size: 0.65em; color: #555; margin-left: 8px; }

.tabs { display: flex; gap: 0; margin-bottom: 12px; border-bottom: 1px solid #2a2a2a; }
.tab { padding: 7px 14px; background: none; border: none; color: #888; cursor: pointer; font-size: 0.8em; font-family: inherit; border-bottom: 2px solid transparent; transition: all 0.2s; }
.tab:hover { color: #ccc; }
.tab.active { color: #fff; border-bottom-color: #6B7DAF; }
.tab-content { display: none; }
.tab-content.active { display: block; }

.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; margin-bottom: 12px; }
.card { background: #1a1a1a; border-radius: 8px; padding: 10px; border: 1px solid #2a2a2a; }
.card .label { font-size: 0.6em; color: #888; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 2px; }
.card .value { font-size: 1.3em; font-weight: 700; }
.card .sub { font-size: 0.65em; color: #666; margin-top: 2px; }
.briik-card { border-left: 3px solid #6B7DAF; }
.iawards-card { border-left: 3px solid #CC3333; }
.total-card { border-left: 3px solid #4CAF50; }
.warn-card { border-left: 3px solid #FF9800; }
.blue { color: #6B7DAF; } .red { color: #CC3333; } .green { color: #4CAF50; } .yellow { color: #FFC107; } .orange { color: #FF9800; }

.filters { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; align-items: center; background: #1a1a1a; padding: 10px 12px; border-radius: 8px; border: 1px solid #2a2a2a; }
.filters label { font-size: 0.65em; color: #888; text-transform: uppercase; margin-right: 3px; }
.filters select, .filters input { background: #0f0f0f; border: 1px solid #333; color: #e0e0e0; padding: 5px 8px; border-radius: 5px; font-size: 0.75em; max-width: 140px; }
.filters select:focus { outline: none; border-color: #6B7DAF; }
.filter-group { display: flex; align-items: center; gap: 4px; }
.btn-reset { background: #2a2a2a; border: 1px solid #444; color: #999; padding: 5px 10px; border-radius: 5px; font-size: 0.7em; cursor: pointer; }
.btn-reset:hover { background: #333; color: #fff; }

.batch-actions { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; align-items: center; }
.batch-actions span { font-size: 0.7em; color: #888; margin-right: 4px; }
.btn-action { background: #1a1a1a; border: 1px solid #333; color: #ccc; padding: 4px 10px; border-radius: 5px; font-size: 0.7em; cursor: pointer; font-family: inherit; transition: all 0.15s; }
.btn-action:hover { background: #2a2a2a; border-color: #555; color: #fff; }
.btn-approve { border-color: #4CAF50; color: #4CAF50; }
.btn-approve:hover { background: #1a2a1a; }
.btn-reject { border-color: #EF5350; color: #EF5350; }
.btn-reject:hover { background: #2a1a1a; }
.btn-modify { border-color: #FF9800; color: #FF9800; }
.btn-modify:hover { background: #2a2a1a; }
.btn-view { border-color: #6B7DAF; color: #6B7DAF; }
.btn-view:hover { background: #1a1a2a; }
.btn-send { border-color: #4CAF50; color: #4CAF50; font-weight: 700; }
.btn-send:hover { background: #1a3a1a; }
.btn-copied { background: #1a3a1a !important; border-color: #4CAF50 !important; }

.table-wrapper { overflow-x: auto; margin-bottom: 16px; -webkit-overflow-scrolling: touch; }
table { width: 100%; border-collapse: collapse; font-size: 0.72em; min-width: 600px; }
th { background: #1a1a1a; color: #888; font-weight: 600; text-align: left; padding: 6px 8px; border-bottom: 1px solid #2a2a2a; font-size: 0.68em; text-transform: uppercase; letter-spacing: 0.5px; cursor: pointer; white-space: nowrap; position: sticky; top: 0; }
th:hover { color: #fff; }
td { padding: 4px 8px; border-bottom: 1px solid #1a1a1a; white-space: nowrap; }
tr:hover { background: #141414; }
tr.selected { background: #1a1a2a; }
tr.expandable { cursor: pointer; }

.expand-row { display: none; }
.expand-row.open { display: table-row; }
.expand-row td { padding: 0; }
.expand-content { background: #141414; border: 1px solid #2a2a2a; border-radius: 5px; margin: 6px 8px; padding: 10px; }
.expand-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.expand-grid .field { margin-bottom: 4px; }
.expand-grid .field-label { font-size: 0.62em; color: #666; text-transform: uppercase; letter-spacing: 0.5px; }
.expand-grid .field-value { font-size: 0.75em; color: #ccc; word-break: break-word; }
.expand-full { grid-column: 1 / -1; }
.expand-body { background: #0f0f0f; border: 1px solid #1a1a1a; border-radius: 4px; padding: 10px; font-size: 0.78em; color: #ccc; white-space: pre-wrap; line-height: 1.45; margin-top: 3px; max-height: 200px; overflow-y: auto; }

.tag-verification-directory { background: #1a2a3a; color: #6B7DAF; }
.tag-hash-changed { background: #3a1a1a; color: #EF5350; font-size:0.6em; }
.no-results { text-align: center; padding: 25px; color: #666; display: none; font-size: 0.8em; }
.result-info { font-size: 0.7em; color: #888; margin-bottom: 6px; }

.footer { margin-top: 20px; padding-top: 10px; border-top: 1px solid #1a1a1a; text-align: center; font-size: 0.65em; color: #555; }

// ============================================================
// TAB SWITCHING
// ============================================================
function switchTab(tab) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
  document.querySelector('[onclick="switchTab(\'' + tab + '\')"]').classList.add('active');
  document.getElementById('tab-' + tab).classList.add('active');
  if (tab === 'revisar') renderReview();
  if (tab === 'enviados') renderSent();
}

// ============================================================
function renderReview() {
  if (!draftsData.length) { updateReviewKPIs(); return; }
  updateReviewKPIs();

  const brands = [...new Set(draftsData.map(d => d.brand))];
  const fi = document.getElementById('filters-review');
  fi.innerHTML =
    '<div class="filter-group"><label>Marca</label><select id="rev-filter-brand" onchange="applyReviewFilters()"><option value="all">Todas</option>' +
    brands.map(b => '<option value="' + b + '">' + b + '</option>').join('') + '</select></div>' +
    '<div class="filter-group"><label>Punt.</label><select id="rev-filter-score" onchange="applyReviewFilters()"><option value="all">Todas</option><option value="80">≥ 80</option><option value="65">≥ 65</option></select></div>' +
    '<div class="filter-group"><label>Estado</label><select id="rev-filter-status" onchange="applyReviewFilters()"><option value="all">Todos</option><option value="drafted">drafted</option><option value="approved">approved</option><option value="needs_review">needs_review</option><option value="rejected">rejected</option></select></div>' +
    '<button class="btn-reset" onclick="resetReviewFilters()">✕</button>';

  applyReviewFilters();
}

let revFiltered = [];
function applyReviewFilters() {
  const brand = document.getElementById('rev-filter-brand')?.value || 'all';
  const score = document.getElementById('rev-filter-score')?.value || 'all';
  const status = document.getElementById('rev-filter-status')?.value || 'all';

  revFiltered = draftsData;
  if (brand !== 'all') revFiltered = revFiltered.filter(d => d.brand === brand);
  if (score !== 'all') revFiltered = revFiltered.filter(d => (d.score || 0) >= parseInt(score));
  if (status !== 'all') revFiltered = revFiltered.filter(d => d.status === status);

  const tbody = document.getElementById('review-table');
  tbody.innerHTML = '';

  if (!revFiltered.length) {
    document.getElementById('no-results-review').style.display = 'block';
    document.getElementById('result-info-review').textContent = '';
    updateBtnCount();
    return;
  }
  document.getElementById('no-results-review').style.display = 'none';
  document.getElementById('result-info-review').textContent = 'Mostrando ' + revFiltered.length + ' de ' + draftsData.length + ' borradores';

  revFiltered.forEach(d => {
    const brandColor = d.brand === 'briik' ? '#6B7DAF' : '#CC3333';
    const brandLabel = d.brand === 'briik' ? 'BRIIK' : 'iAwards';
    const verifMap = {official:'Oficial',official_directory:'Directorio',corroborated_directory:'Directorio'};
    const verifLabel = verifMap[d.email_verification] || d.email_verification || '';
    const verifClass = d.email_verification === 'official' ? 'tag-verification-official' : 'tag-verification-directory';
    const statusLabels = {drafted:'drafted',needs_review:'⚠ revisar',approved:'✓ aprobado',rejected:'✗ rechazado',sent:'enviado',error:'error'};
    const statusLabel = statusLabels[d.status] || d.status;
    const statusClass = 'tag-' + (d.status === 'needs_review' ? 'needs_review' : d.status === 'approved' ? 'approved' : d.status === 'rejected' ? 'rejected' : d.status === 'sent' ? 'sent' : 'drafted');
    const isNeedsReview = d.status === 'needs_review';
    const checked = selectedIds.has(d.id) ? 'checked' : '';

    const tr = document.createElement('tr');
    tr.className = 'expandable';
    tr.setAttribute('data-id', d.id);
    if (selectedIds.has(d.id)) tr.classList.add('selected');
    tr.onclick = (e) => { if (e.target.tagName !== 'INPUT') toggleExpand(d.id); };
    tr.innerHTML =
      '<td class="check-col" onclick="event.stopPropagation()"><input type="checkbox" ' + checked + ' onchange="toggleSelect(\'' + d.id + '\', this.checked)"></td>' +
      '<td style="font-size:0.7em;color:#888;">' + d.id + '</td>' +
      '<td style="color:' + brandColor + ';font-weight:600;">' + brandLabel + '</td>' +
      '<td>' + d.organization + '</td>' +
      '<td>' + d.city + '</td>' +
      '<td style="font-size:0.7em;">' + d.segment + '</td>' +
      '<td>' + d.score + '</td>' +
      '<td><span class="tag ' + verifClass + '">' + verifLabel + '</span></td>' +
      '<td><span class="tag ' + statusClass + '">' + statusLabel + '</span></td>';
    tbody.appendChild(tr);

    const expTr = document.createElement('tr');
    expTr.className = 'expand-row';
    expTr.id = 'exp-' + d.id;
    expTr.innerHTML =
      '<td colspan="9"><div class="expand-content"><div class="expand-grid">' +
      '<div class="field"><div class="field-label">Evidencia</div><div class="field-value">' + (d.evidence||'') + ' <a href="' + (d.evidence_url||'#') + '" target="_blank" style="color:#6B7DAF;font-size:0.75em;">[fuente]</a></div></div>' +
      '<div class="field"><div class="field-label">Email · Verificación</div><div class="field-value">' + (d.email||'--') + ' <span class="tag ' + verifClass + '">' + verifLabel + '</span> <a href="' + (d.email_source_url||'#') + '" target="_blank" style="color:#6B7DAF;font-size:0.75em;">[fuente]</a></div></div>' +
      '<div class="field expand-full"><div class="field-label">Asunto</div><div class="field-value" style="font-weight:600;">' + (d.subject||'') + '</div></div>' +
      '<div class="field expand-full"><div class="field-label">Cuerpo</div><div class="expand-body">' + (d.body||'') + '</div></div>' +
      '<div class="field"><div class="field-label">Adjunto</div><div class="field-value">📎 ' + (d.attachment||'N/A') + '</div></div>' +
      '<div class="field"><div class="field-label">Hash · ' + (d.draft_hash||'--') + '</div><div class="field-value" style="font-size:0.65em;color:#555;">' + (d.status==='approved'&&d.draft_hash?'⚠ Aprobación inválida si el hash cambia':'') + '</div></div>' +
      (d.review_issue ? '<div class="field expand-full"><div class="field-label" style="color:#FF9800;">⚠ Incidencia</div><div class="field-value" style="color:#FF9800;">' + d.review_issue + '</div></div>' : '') +
      '</div><div class="expand-actions">' +
      '<button class="btn-action btn-approve" onclick="event.stopPropagation(); copyCmd(\'APROBAR ' + d.id + '\')">📋 APROBAR</button>' +
      '<button class="btn-action btn-modify" onclick="event.stopPropagation(); copyCmd(\'MODIFICAR ' + d.id + ': \')">📋 MODIFICAR</button>' +
      '<button class="btn-action btn-reject" onclick="event.stopPropagation(); copyCmd(\'RECHAZAR ' + d.id + ': \')">📋 RECHAZAR</button>' +
      '<button class="btn-action btn-view" onclick="event.stopPropagation(); copyCmd(\'VER ' + d.id + '\')">📋 VER</button>' +
      '</div></div></td>';
    tbody.appendChild(expTr);
  });
  updateBtnCount();
}

function toggleExpand(id) {
  const row = document.getElementById('exp-' + id);
  if (!row) return;
  document.querySelectorAll('.expand-row.open').forEach(r => r.classList.remove('open'));
  if (!row.classList.contains('open')) row.classList.add('open');
}

function toggleSelect(id, checked) {
  if (checked) selectedIds.add(id); else selectedIds.delete(id);
  document.querySelectorAll('tr[data-id="' + id + '"]').forEach(r => {
    if (checked) r.classList.add('selected'); else r.classList.remove('selected');
  });
  updateBtnCount();
  updateSelectAllCheck();
}

function toggleAllCheck(el) {
  revFiltered.forEach(d => {
    if (el.checked) selectedIds.add(d.id); else selectedIds.delete(d.id);
  });
  applyReviewFilters();
  updateBtnCount();
}

function updateSelectAllCheck() {
  const all = document.getElementById('select-all-check');
  const eligible = revFiltered.filter(d => d.status !== 'needs_review');
  if (all) all.checked = eligible.length > 0 && eligible.every(d => selectedIds.has(d.id));
}

function updateBtnCount() {
  const eligible = [...selectedIds].filter(id => {
    const d = draftsData.find(c => c.id === id);
    return d && d.status !== 'needs_review';
  });
  const btn = document.getElementById('btn-approve-sel');
  if (btn) btn.textContent = '📋 Copiar APROBAR seleccionados (' + eligible.length + ')';

  // Visual feedback: strike through needs_review in selection display
  document.querySelectorAll('.expandable').forEach(tr => {
    const id = tr.getAttribute('data-id');
    const d = draftsData.find(c => c.id === id);
    if (d && d.status === 'needs_review' && selectedIds.has(id)) {
      tr.style.opacity = '0.5';
    } else {
      tr.style.opacity = '1';
    }
  });
}

function copySelected() {
  const eligible = [...selectedIds].filter(id => {
    const d = draftsData.find(c => c.id === id);
    return d && d.status !== 'needs_review';
  });
  if (!eligible.length) return;
  const runId = getRunId();
  const cmd = eligible.map(id => 'APROBAR ' + id).join('\n');
  copyCmd('APROBAR ' + runId + ' TODO\n\n-- o individuales --\n' + cmd);
}

function selectAll() { draftsData.forEach(d => { if (d.status !== 'sent' && d.status !== 'rejected') selectedIds.add(d.id); }); applyReviewFilters(); }
function selectNone() { selectedIds.clear(); applyReviewFilters(); }

function copyCmd(text) {
  navigator.clipboard.writeText(text).catch(() => {});
}

function resetReviewFilters() {
  ['rev-filter-brand','rev-filter-score','rev-filter-status'].forEach(id => {
    const el = document.getElementById(id); if (el) el.value = 'all';
  });
  applyReviewFilters();
}

function updateReviewKPIs() {
  const briik = draftsData.filter(d => d.brand === 'briik');
  const iawards = draftsData.filter(d => d.brand === 'iawards');
  const drafted = draftsData.filter(d => d.status === 'drafted').length;
  const approved = draftsData.filter(d => d.status === 'approved').length;
  const review = draftsData.filter(d => d.status === 'needs_review').length;
  const rejected = draftsData.filter(d => d.status === 'rejected').length;
  const runId = draftMeta.run_id || 'SIN-TANDA';

  document.getElementById('kpi-review').innerHTML =
    '<div class="card briik-card"><div class="label">BRIIK</div><div class="value blue">' + briik.length + '</div><div class="sub">' + briik.filter(d=>d.status==='drafted').length + ' listos · ' + briik.filter(d=>d.status==='needs_review').length + ' revisar · ' + briik.filter(d=>d.status==='approved').length + ' ✓</div></div>' +
    '<div class="card iawards-card"><div class="label">iAwards</div><div class="value red">' + iawards.length + '</div><div class="sub">' + iawards.filter(d=>d.status==='drafted').length + ' listos · ' + iawards.filter(d=>d.status==='approved').length + ' ✓</div></div>' +
    '<div class="card total-card"><div class="label">Tanda</div><div class="value green">' + draftsData.length + '</div><div class="sub">' + runId + '</div></div>' +
    '<div class="card warn-card"><div class="label">Pendiente</div><div class="value orange">' + review + '</div><div class="sub">' + approved + ' aprobados · ' + rejected + ' rechazados</div></div>';
}

// ============================================================
// SENT TAB
// ============================================================
let filteredSent = [...allData];
let sortCol = 0, sortDir = -1;

function initSentFilters() {
  const cities = [...new Set(allData.map(d=>d.city))].sort();
  const sel = document.getElementById('filter-city');
  sel.innerHTML = '<option value="all">Todas</option>';
  cities.forEach(c => { const o = document.createElement('option'); o.value=c; o.textContent=c; sel.appendChild(o); });
  const dates = allData.map(d=>d.date).sort();
  document.getElementById('filter-from').value = dates[0];
  document.getElementById('filter-to').value = dates[dates.length-1];
  applySentFilters();
}

function applySentFilters() {
  const brand = document.getElementById('filter-brand').value;
  const city = document.getElementById('filter-city').value;
  const status = document.getElementById('filter-status').value;
  const from = document.getElementById('filter-from').value;
  const to = document.getElementById('filter-to').value;
  const search = document.getElementById('filter-search').value.toLowerCase();

  filteredSent = allData.filter(d => {
    if (brand !== 'all' && d.brand !== brand) return false;
    if (city !== 'all' && d.city !== city) return false;
    if (status === 'Enviado' && d.status !== 'Enviado') return false;
    if (status === 'Interesada' && !d.notes.toLowerCase().includes('interesada')) return false;
    if (status === 'NoInteresa' && !d.notes.toLowerCase().includes('no interesa') && !d.notes.toLowerCase().includes('no trabaja')) return false;
    if (from && d.date < from) return false;
    if (to && d.date > to) return false;
    if (search && !d.name.toLowerCase().includes(search) && !d.email.toLowerCase().includes(search)) return false;
    return true;
  });

  const keyMap = ['date','brand','city','name','','score','status','notes'];
  const key = keyMap[sortCol] || 'date';
  filteredSent.sort((a,b) => {
    let va = a[key]||'', vb = b[key]||'';
    if (key === 'score') { va = parseInt(va)||0; vb = parseInt(vb)||0; return (va-vb)*sortDir; }
    return String(va).localeCompare(String(vb)) * sortDir;
  });
  renderSent();
}

function renderSent() {
  const tbody = document.getElementById('sent-table');
  tbody.innerHTML = '';
  document.getElementById('no-results-sent').style.display = filteredSent.length ? 'none' : 'block';
  document.getElementById('result-info-sent').textContent = filteredSent.length ? 'Mostrando ' + filteredSent.length + ' de ' + allData.length : '';

  filteredSent.forEach(d => {
    const tr = document.createElement('tr');
    const tag = d.status === 'Enviado' ? 'tag-sent' : 'tag-replied';
    const brandColor = d.brand === 'BRIIK' ? '#6B7DAF' : '#CC3333';
    let noteTag = '';
    if (d.notes.toLowerCase().includes('interesada')) noteTag = 'tag-replied';
    else if (d.notes.toLowerCase().includes('no interesa') || d.notes.toLowerCase().includes('no trabaja')) noteTag = 'tag-rejected';

    tr.innerHTML = '<td>' + d.date.split('-').reverse().slice(0,2).join('/') + '</td>' +
      '<td style="color:' + brandColor + ';font-weight:600;">' + d.brand + '</td>' +
      '<td>' + d.city + '</td><td>' + d.name + '</td>' +
      '<td style="font-size:0.7em;color:#aaa;">' + (d.email||'') + '</td>' +
      '<td>' + d.score + '</td>' +
      '<td><span class="tag ' + tag + '">' + d.status + '</span></td>' +
      '<td>' + (noteTag?'<span class="tag '+noteTag+'">'+d.notes+'</span>':d.notes) + '</td>';
    tbody.appendChild(tr);
  });
  updateSentKPIs();
}

function sortSent(col) {
  if (sortCol === col) sortDir *= -1; else { sortCol = col; sortDir = col===0?-1:1; }
  applySentFilters();
}

function resetFilters() {
  ['filter-brand','filter-city','filter-status'].forEach(id => document.getElementById(id).value='all');
  const dates = allData.map(d=>d.date).sort();
  document.getElementById('filter-from').value = dates[0];
  document.getElementById('filter-to').value = dates[dates.length-1];
  document.getElementById('filter-search').value = '';
  applySentFilters();
}

function updateSentKPIs() {
  const total = allData.length;
  const briik = allData.filter(d=>d.brand==='BRIIK').length;
  const iawards = allData.filter(d=>d.brand==='iAwards').length;
  const replies = allData.filter(d=>d.notes).length;
  const interest = allData.filter(d=>d.notes.toLowerCase().includes('interesada')).length;
  document.getElementById('kpi-sent').innerHTML =
    '<div class="card briik-card"><div class="label">BRIIK</div><div class="value blue">' + briik + '</div></div>' +
    '<div class="card iawards-card"><div class="label">iAwards</div><div class="value red">' + iawards + '</div></div>' +
    '<div class="card total-card"><div class="label">Total</div><div class="value green">' + total + '</div></div>' +
    '<div class="card" style="border-left:3px solid #FFC107;"><div class="label">Respuestas</div><div class="value yellow">' + replies + '</div><div class="sub">' + interest + ' interés · ' + (total>0?Math.round(replies/total*100):0) + '%</div></div>';
}

// ============================================================
// INIT
// ============================================================
['filter-brand','filter-city','filter-status','filter-from','filter-to'].forEach(id => {
  const el = document.getElementById(id); if (el) el.addEventListener('change', applySentFilters);
});
document.getElementById('filter-search')?.addEventListener('input', applySentFilters);

loadDrafts();
initSentFilters();
</script>
</body>
</html>
